# Netlify configuration.
#
# Netlify detects Next.js and applies its OpenNext-based runtime automatically,
# so there is no plugin to install. What this file does is set the timing
# budgets, because serverless functions are killed at a fixed wall-clock limit
# and the defaults in .env.example assume a long-lived server.

[build]
  command = "npm run build"

  # The schema is NOT applied here. Netlify's managed database keeps its
  # connection string out of the build environment, so `prisma migrate deploy`
  # cannot reach it from a build command. Instead Netlify applies the SQL in
  # netlify/database/migrations/ against that database itself during the
  # deploy. That file is generated from prisma/schema.prisma, which remains
  # the single source of truth for the schema.

  # `publish` is intentionally not set. The Next.js runtime works out the right
  # directory itself, and hardcoding it is a common way to get a "publish
  # directory does not contain expected Next.js build output" failure.

[build.environment]
  NODE_VERSION = "22"

  # Netlify's synchronous function limit is 10 seconds on the free tier.
  # These keep a whole audit comfortably inside it:
  #
  #   AUDIT_TIMEOUT  total budget for the page + robots.txt + sitemap
  #   CRAWL_TIMEOUT  the page fetch alone, inside that total
  #
  # A slow site therefore returns a clear "took too long to respond" instead of
  # the function being killed and the user seeing a platform error page.
  AUDIT_TIMEOUT = "8500"
  CRAWL_TIMEOUT = "6000"

# Security headers. These mirror next.config.ts so they are present even on
# responses Netlify serves directly from its edge, such as static assets.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
